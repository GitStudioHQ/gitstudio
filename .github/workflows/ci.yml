name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing more: both jobs only check out, build and test. The
# npm cache and the uploaded .vsix go through the Actions runtime token, which
# these scopes do not govern, so neither needs a write.
permissions:
  contents: read

jobs:
  # Tests run on every OS the release workflows build on — otherwise a tagged
  # release is the FIRST time the suite ever executes on windows/mac, and a
  # failure there yields a half-published release instead of a red PR.
  #
  # Windows runs the suite three times slower than the others (about 75 min in
  # one job), so it is split by workspace into three jobs that run side by side
  # (scripts/test/shard.mjs; "all" runs everything).
  test:
    name: test (${{ matrix.os }}${{ matrix.shard != 'all' && format(', {0}', matrix.label) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: all, label: all }
          - { os: macos-14, shard: all, label: all }
          - { os: windows-latest, shard: extension, label: extension }
          - { os: windows-latest, shard: desktop, label: desktop }
          - { os: windows-latest, shard: rest, label: packages }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The macOS runner's own Chrome hangs on exit in headless mode — a minute
      # a launch, and checks time out at random. Give the webview checks the
      # windowless headless shell they use everywhere else; findChrome prefers
      # it to the system Chrome.
      - name: Headless Chrome for the webview checks (macOS)
        if: runner.os == 'macOS'
        run: npx --yes playwright@1.63.0 install chromium-headless-shell

      - name: Type-check
        run: npm run check-types

      # Coverage is collected on the Ubuntu leg only: c8 records V8's own
      # coverage from every process the tests start (tsx, child node, git
      # helpers), so the tests run exactly as they do on the other legs. One
      # c8 run per workspace, merged by line (scripts/test/coverage.mjs says
      # why a single run over the whole repo reported shared files wrong).
      - name: Test
        if: matrix.os != 'ubuntu-latest' && matrix.shard == 'all'
        run: npm test

      - name: Test (${{ matrix.label }})
        if: matrix.shard != 'all'
        run: node scripts/test/shard.mjs ${{ matrix.shard }}

      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/test/coverage.mjs

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: GitStudioHQ/gitstudio
          files: coverage/lcov.info

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Engine purity guard
        run: npm run check-purity

      # Every message the code asks for is in its product's English source
      # bundle (a new l10n.t() that nobody re-extracted fails here), and every
      # translation covers it with the same placeholders and no added markup.
      - name: Translations are complete
        run: |
          node scripts/i18n/bundle-nls.mjs --write
          git diff --exit-code -- apps/extension/l10n apps/merge-studio/l10n apps/desktop/l10n
          npm run i18n

      - name: Package extension (smoke-test the build)
        run: |
          npm run package
          npx @vscode/vsce package -o gitstudio.vsix --no-dependencies \
            --baseImagesUrl https://github.com/GitStudioHQ/gitstudio/raw/HEAD/apps/extension \
            --baseContentUrl https://github.com/GitStudioHQ/gitstudio/blob/HEAD/apps/extension
        working-directory: apps/extension

      - uses: actions/upload-artifact@v4
        with:
          name: gitstudio-vsix
          path: apps/extension/gitstudio.vsix

      - name: Build desktop bundles (smoke-test)
        run: npm run build --workspace apps/desktop
