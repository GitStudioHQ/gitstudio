name: Release Desktop

# Builds the GitStudio desktop (Electron) app for macOS (Apple Silicon + Intel),
# Windows, and Linux and uploads the per-OS installers (.dmg / .exe / .AppImage /
# .deb) to the GitHub Release when an `app-v*` tag is pushed.
#
# Cut a release:
#   1. bump "version" in apps/desktop/package.json
#   2. git tag app-v1.0.0 && git push origin app-v1.0.0
#
# Structure: ONE create-release job makes the Release (so four matrix jobs never
# race `gh release create` against each other), then the per-OS build jobs only
# upload assets. Desktop releases stay the repo's "latest" release — the in-app
# auto-updater resolves /releases/latest, and extension (`ext-v*`) releases are
# created with --latest=false so they can never hijack that pointer.
#
# Code-signing/notarization are OPTIONAL: electron-builder builds UNSIGNED when
# the CSC_*/APPLE_* secrets are absent. With no secrets you still get working
# (unsigned) installers attached to the Release.

on:
  push:
    tags:
      - 'app-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  # finalize-release opens the Homebrew cask PR (main's ruleset forbids a direct
  # push). Without this the branch pushes and `gh pr create` fails with
  # "Resource not accessible by integration".
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Guard: tag matches package.json version"
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        run: |
          node -e '
            const v = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^app-v/, "");
            if (v !== tag) {
              console.error(`Tag app-v${tag} != package.json version ${v}`);
              process.exit(1);
            }'

      - name: Create the GitHub Release (once, before the matrix)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          # DRAFT, and deliberately NOT --latest yet. This job runs before the
          # build matrix, so publishing here would advertise a "latest" release
          # with no installers attached — and a failure on any one platform
          # would leave it permanently half-empty. The finalize job below flips
          # it public only after every installer has uploaded.
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" --draft \
              --title "GitStudio ${GITHUB_REF_NAME#app-v}" --notes-file "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
              --title "GitStudio ${GITHUB_REF_NAME#app-v}"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build each mac arch NATIVELY (macos-14 = Apple Silicon, macos-15-intel
          # = x64; macos-13 was retired by GitHub in Dec 2025) so node-pty's
          # per-arch prebuild loads without cross-compiling.
          #
          # NOTE: mac deliberately does NOT upload latest-mac.yml. Both arch runners
          # emit an identically-named latest-mac.yml, so a --clobber upload would
          # leave the Release with ONE arch's feed and mis-update the other; the
          # app skips update checks on macOS instead (see autoUpdate.ts). Windows/
          # Linux are single-arch, so their feeds are safe.
          - os: macos-14
            artifact: 'apps/desktop/release/*.dmg apps/desktop/release/*.zip'
          - os: macos-15-intel
            artifact: 'apps/desktop/release/*.dmg apps/desktop/release/*.zip'
          - os: windows-latest
            artifact: 'apps/desktop/release/*.exe apps/desktop/release/*.yml apps/desktop/release/*.blockmap'
          # ubuntu-22.04 (not -latest): the AppImage links the build host's glibc,
          # so building on 24.04 (glibc 2.39) breaks Ubuntu 22.04/Debian 12 users.
          # No *.blockmap here — AppImage/deb don't emit one, and a non-matching
          # glob would fail the upload.
          # .rpm and .tar.gz join .AppImage and .deb: gitstudio.dev has offered
          # Fedora/RHEL and portable downloads all along and the release never
          # produced them, so both links 404'd.
          - os: ubuntu-22.04
            artifact: 'apps/desktop/release/*.AppImage apps/desktop/release/*.deb apps/desktop/release/*.rpm apps/desktop/release/*.tar.gz apps/desktop/release/latest-linux.yml'
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder reads these; when absent it builds UNSIGNED (it does not
      # fail). Provide them as repo secrets to enable signing/notarization.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # electron-builder shells out to `rpmbuild` for the .rpm target and it is
      # not on the ubuntu runner image. Without this the Linux build fails at
      # the very end, after everything else has already been produced.
      - name: Install rpm tooling (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Install (workspace root)
        run: npm ci

      - name: Type-check
        run: npm run check-types --workspaces --if-present

      - name: Test
        run: npm test

      - name: Build bundles (main / preload / renderer)
        run: npm run build --workspace apps/desktop

      - name: Build installer (electron-builder)
        working-directory: apps/desktop
        shell: bash
        run: |
          # GitHub sets `env: FOO: ${{ secrets.FOO }}` to an EMPTY STRING when
          # the secret is unset. electron-builder treats an empty CSC_LINK as a
          # relative cert PATH and resolves it to the project dir → the macOS
          # build dies with "<dir> not a file". Unset the empty signing vars so
          # unsigned builds work; disable mac auto-discovery for good measure.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
                   APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --publish never

      - name: Upload installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" ${{ matrix.artifact }} --clobber

  # Only now is the release real: every platform built and uploaded. `needs`
  # means a single failed matrix leg leaves the release a draft rather than
  # shipping a broken "latest" to users and to electron-updater.
  finalize-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify installers are attached
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "${GITHUB_REF_NAME}" --json assets \
                     --jq '.assets[].name' | tr '\n' ' ')
          echo "Attached: $ASSETS"
          # One installer per platform, plus the Windows/Linux update feeds.
          # NOT latest-mac.yml: macOS deliberately ships no feed (both arch
          # runners emit an identically-named file and would clobber each other
          # — see the matrix note above and autoUpdate.ts). Requiring it here
          # would fail every release.
          for want in ".dmg" ".zip" ".exe" ".AppImage" ".deb" ".rpm" ".tar.gz" "latest.yml" "latest-linux.yml"; do
            case "$ASSETS" in
              *"$want"*) ;;
              *) echo "::error::No asset matching '$want' — refusing to publish ${GITHUB_REF_NAME}."; exit 1 ;;
            esac
          done

      # The installers (scripts/install.sh, scripts/install.ps1) verify what they
      # download, and the Homebrew cask cannot exist without a sha256. Both need
      # the real digests of the assets the matrix just uploaded, so they are
      # computed HERE, from the files as published, rather than trusted from a
      # build job that could have been re-run.
      - name: Publish checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-sums && cd dist-sums
          gh release download "${GITHUB_REF_NAME}" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' \
            --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber

      # Housekeeping: it must never block publishing (see the note inside).
      - name: Stamp the Homebrew cask
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARM=$(awk -v f="GitStudio-${VERSION}-arm64.dmg" '$2==f{print $1}' dist-sums/SHA256SUMS.txt)
          X64=$(awk -v f="GitStudio-${VERSION}-x64.dmg"   '$2==f{print $1}' dist-sums/SHA256SUMS.txt)
          if [ -z "$ARM" ] || [ -z "$X64" ]; then
            echo "::error::Missing a mac dmg checksum — arm64='$ARM' x64='$X64'"; exit 1
          fi
          python3 - "$VERSION" "$ARM" "$X64" <<'PY'
          import re, sys
          version, arm, x64 = sys.argv[1], sys.argv[2], sys.argv[3]
          p = "Casks/gitstudio.rb"
          s = open(p).read()
          s = re.sub(r'^  version "[^"]*"$', f'  version "{version}"', s, count=1, flags=re.M)
          # Two sha256 lines, in on_arm then on_intel order — replace positionally.
          shas = iter([arm, x64])
          s = re.sub(r'sha256 "[0-9a-f]{64}"', lambda m: f'sha256 "{next(shas)}"', s, count=2)
          open(p, "w").write(s)
          print(s)
          PY
          # Always attach the stamped cask to the release, so the correct file
          # exists even if landing it on main is delayed.
          gh release upload "${GITHUB_REF_NAME}" Casks/gitstudio.rb --clobber

          if git diff --quiet Casks/gitstudio.rb; then
            echo "Cask already current."
            exit 0
          fi

          # A PULL REQUEST, not a push to main. The repository ruleset requires
          # changes to main to go through one, and the Actions token has no
          # bypass — the first version of this step pushed directly, was
          # rejected with GH013, and took the whole release down with it even
          # though every installer had built and uploaded fine. Publishing must
          # never hinge on a housekeeping commit.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="cask/${GITHUB_REF_NAME}"
          git checkout -b "$BRANCH"
          git add Casks/gitstudio.rb
          git commit -m "release(cask): GitStudio ${VERSION}"
          if git push origin "$BRANCH" --force; then
            gh pr create --base main --head "$BRANCH" \
              --title "release(cask): GitStudio ${VERSION}" \
              --body "Stamps \`Casks/gitstudio.rb\` with the version and the two per-arch SHA256s of the macOS disk images published in ${GITHUB_REF_NAME}. Generated by \`finalize-release\`; merging it makes \`brew install --cask gitstudio\` resolve to this release." \
              || echo "::warning::Could not open the cask PR for ${GITHUB_REF_NAME} (it may already exist). The branch ${BRANCH} is pushed and the stamped cask is on the release."
          else
            echo "::warning::Could not push ${BRANCH}. The stamped cask is attached to the release; land it by hand."
          fi

      - name: Publish the release
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
