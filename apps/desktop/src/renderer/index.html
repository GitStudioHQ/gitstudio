<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Locked-down CSP for the desktop renderer. No remote code: scripts/styles
      are the bundled, same-origin assets; Monaco needs blob: workers and data:
      fonts. The renderer has NO Node access (contextIsolation on); all host
      power comes through the preload's `window.gitstudio` bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; worker-src 'self' blob:; connect-src 'self'"
    />
    <link rel="stylesheet" href="./renderer.css" />
    <title>GitStudio</title>
    <!-- launch:style -->
    <style>
      /* THE LAUNCH SCREEN (#launch, below). It is the window's first frame: it
         is painted from this file alone — inline CSS and inline SVG, no bundle,
         no network — so the window can go up as soon as the bundle starts
         running (launch-reveal.js, or theme-boot.js 150ms after this frame),
         rather than after the 5.7 MB bundle has run.
         launchScreen.ts fades it out once the shell is up.

         Colours are the app's own: the ground is --app-bg for the theme
         (test/launchScreen.test.ts keeps the two equal), the mark is the Dock
         icon's own palette (brand/gitstudio-icon.svg) in both themes, and the
         wordmark is brand/gitstudio-wordmark-*.svg's own outlined glyphs. The
         theme comes from the body class theme-boot.js set a moment earlier,
         which already honours the theme picked in Settings. (Dark once wore
         brand/gitstudio-mark.svg's deeper slate: on this ground it read as a
         shadow of the icon, not the icon.)

         The mark is WHOLE from the first frame: cube, commit graph and
         wordmark are all painted at full strength, and only transform moves
         them. The app is often up within a couple of hundred milliseconds, and
         the screen never holds it back (launchScreen.ts), so any part that
         faded or assembled in was caught half-drawn by the hand-off — a cube
         without its graph, no wordmark. What moves is the settle (a small
         scale and lift), the glow behind it, and a progress sweep that shows
         only if the start is still going at 1.2s. Transform and opacity only,
         on HTML boxes, so it all runs on the compositor while the bundle holds
         the main thread. Reduced motion: nothing moves but the glow's fade. */
      #launch {
        --lc-bg: #0d1016;
        --lc-top-a: #7b79a6;
        --lc-top-b: #5d5b82;
        --lc-left-a: #39375a;
        --lc-left-b: #2a2845;
        --lc-right-a: #55527c;
        --lc-right-b: #403e63;
        --lc-edge: rgba(255, 255, 255, 0.26);
        --lc-lane-a: #c4adff;
        --lc-lane-b: #9a78ff;
        --lc-node: #b49bff;
        --lc-node-c: #c2abff;
        --lc-core: #2a2845;
        --lc-ink: #f5f3ff;
        --lc-glow: rgba(124, 92, 240, 0.2);
        --lc-track: rgba(245, 243, 255, 0.07);
        --lc-bar: #a98cff;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--lc-bg);
        /* The window's title bar until the app has one: it drags. */
        -webkit-app-region: drag;
        cursor: default;
        user-select: none;
        contain: strict;
        /* Ease-in: the ground holds while the mark leaves (below), then goes. */
        transition: opacity 220ms cubic-bezier(0.4, 0, 1, 1);
      }
      /* Dark style ▸ Neon: the Neon block's --app-bg, and a stronger glow. */
      body.vscode-dark.gs-neon #launch {
        --lc-bg: #09090e;
        --lc-glow: rgba(124, 92, 240, 0.28);
      }
      body.vscode-light #launch {
        --lc-bg: #eef1f5;
        --lc-edge: rgba(27, 31, 42, 0.16);
        --lc-ink: #1b1f2a;
        --lc-glow: rgba(124, 92, 240, 0.13);
        --lc-track: rgba(27, 31, 42, 0.08);
        --lc-bar: #7c5cf0;
      }
      #launch .launch-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-2vh);
        transition:
          transform 240ms cubic-bezier(0.4, 0, 0.2, 1),
          opacity 90ms cubic-bezier(0, 0, 0.2, 1);
      }
      #launch .launch-mark { position: relative; width: 96px; height: 102px; }
      /* Every moving part is an HTML box around its SVG, never the <svg>
         itself: Chromium runs an animation on an SVG element on the main
         thread, which the bundle holds for most of a cold start — the graph
         and the wordmark sat frozen at their first frame until it let go.
         A box's transform and opacity run on the compositor. */
      #launch .launch-cube,
      #launch .launch-graph { position: absolute; inset: 0; }
      #launch .launch-cube > svg,
      #launch .launch-graph > svg,
      #launch .launch-word > svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #launch .launch-glow,
      #launch .launch-mark,
      #launch .launch-word,
      #launch .launch-progress > i { will-change: transform, opacity; }
      #launch .launch-glow {
        position: absolute;
        left: 50%;
        top: 46.5%;
        width: 280px;
        height: 280px;
        margin: -140px 0 0 -140px;
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--lc-glow), transparent);
      }
      #launch .launch-word { width: 150px; height: 27px; margin-top: 22px; }
      #launch .launch-word-git { fill: var(--lc-ink); }
      #launch .lc-top-a { stop-color: var(--lc-top-a); }
      #launch .lc-top-b { stop-color: var(--lc-top-b); }
      #launch .lc-left-a { stop-color: var(--lc-left-a); }
      #launch .lc-left-b { stop-color: var(--lc-left-b); }
      #launch .lc-right-a { stop-color: var(--lc-right-a); }
      #launch .lc-right-b { stop-color: var(--lc-right-b); }
      #launch .lc-lane-a { stop-color: var(--lc-lane-a); }
      #launch .lc-lane-b { stop-color: var(--lc-lane-b); }
      #launch .launch-edge { stroke: var(--lc-edge); }
      #launch .launch-node { fill: var(--lc-node); }
      #launch .launch-node-c { fill: var(--lc-node-c); }
      #launch .launch-core { fill: var(--lc-core); }
      #launch .launch-progress {
        position: relative;
        width: 112px;
        height: 2px;
        margin-top: 26px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--lc-track);
      }
      #launch .launch-progress > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--lc-bar), transparent);
      }

      @keyframes launch-glow { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }
      /* Transform only: whatever frame the hand-off lands on, the mark is whole. */
      @keyframes launch-settle { from { transform: translateY(6px) scale(0.95); } to { transform: none; } }
      @keyframes launch-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes launch-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

      #launch .launch-glow { animation: launch-glow 900ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      #launch .launch-mark { animation: launch-settle 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      #launch .launch-word { animation: launch-settle 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      #launch .launch-progress { animation: launch-fade 400ms ease 1200ms both; }
      /* Bounded, not infinite: a start that takes a minute has bigger news. */
      #launch .launch-progress > i { animation: launch-sweep 1100ms cubic-bezier(0.45, 0, 0.55, 1) 1200ms 60 both; }

      /* The hand-off (launchScreen.ts): the app is already painted beneath, so
         the screen dissolves as the mark eases toward you — the mark goes
         first, so the app never shows through with a logo stamped on it: the
         mark is gone in 90ms (ease-out) while the ground, easing in, has only
         just begun to fade. (Both once eased over similar spans and their
         opacities multiplied — for ~100ms a third-strength logo sat over a
         half-visible app.) From
         the first frame of it, clicks and drags belong to the app. */
      #launch.is-leaving { opacity: 0; pointer-events: none; -webkit-app-region: no-drag; }
      #launch.is-leaving .launch-stage { opacity: 0; transform: translateY(-2vh) scale(1.04); }

      @media (prefers-reduced-motion: reduce) {
        #launch { transition-duration: 160ms; }
        #launch .launch-glow { animation: launch-fade 240ms ease-out both; }
        #launch .launch-mark,
        #launch .launch-word { animation: none; }
        #launch .launch-progress { display: none; }
        #launch.is-leaving .launch-stage { transform: translateY(-2vh); }
      }
    </style>
    <!-- /launch:style -->
  </head>
  <body>
